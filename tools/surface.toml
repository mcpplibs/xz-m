# What tools/generate.py cannot read from the headers; everything else it can.
name          = "xz"
title         = "liblzma of XZ Utils 5.8.3"
compat        = "xz"
version       = "5.8.3"
license       = "0BSD"
generated-on  = "linux"
headers       = ["lzma.h"]
owned         = ["lzma.h", "lzma/base.h", "lzma/bcj.h", "lzma/block.h", "lzma/check.h", "lzma/container.h",
                 "lzma/delta.h", "lzma/filter.h", "lzma/hardware.h", "lzma/index.h", "lzma/index_hash.h",
                 "lzma/lzma12.h", "lzma/stream_flags.h", "lzma/version.h", "lzma/vli.h"]

# How the headers write the declarations, not what liblzma offers: linkage and
# calling convention (LZMA_API, LZMA_API_CALL, LZMA_API_IMPORT), attributes
# (lzma_attribute, lzma_attr_*, lzma_nothrow), and the stringification steps
# that build LZMA_VERSION_STRING, which is mapped.
syntax = [
  "LZMA_API", "LZMA_API_CALL", "LZMA_API_IMPORT", "LZMA_API_STATIC",
  "lzma_attribute", "lzma_attr_const", "lzma_attr_pure", "lzma_attr_warn_unused_result", "lzma_nothrow",
  "LZMA_VERSION_STRING_C", "LZMA_VERSION_STRING_C_",
]

# Declared by lzma.h, defined in sources that compat.xz 5.8.3 does not build
# (hardware_cputhreads.c, stream_encoder_mt.c, stream_decoder_mt.c: the
# multithreaded coders need a thread library the package does not configure).
unbuilt = ["lzma_cputhreads", "lzma_stream_encoder_mt", "lzma_stream_encoder_mt_memusage", "lzma_stream_decoder_mt"]
